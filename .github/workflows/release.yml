name: Build & Release VSCode Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.0.1 - leave blank to use version from package.json)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Top-level workflow permissions are explicitly empty for least-privilege security
permissions: {}

jobs:
  build-and-release:
    name: Build & Release Extension (.vsix)
    runs-on: ubuntu-latest
    # Job permissions: contents: write is required to create GitHub Releases and upload VSIX assets
    permissions:
      contents: write # required to create GitHub Releases and upload VSIX assets

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Webview Dependencies
        run: npm --prefix webview ci

      - name: Build Webview
        run: npm --prefix webview run build

      - name: Build Extension (TypeScript)
        run: npm run compile

      - name: Determine Release Tag & Name
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG_NAME" ]; then
            TAG="$INPUT_TAG_NAME"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          VSIX_NAME="dataflow-pipeline-builder-${TAG}.vsix"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=Release ${TAG}" >> "$GITHUB_OUTPUT"
          echo "vsix_name=${VSIX_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package Extension (.vsix)
        env:
          VSIX_NAME: ${{ steps.release_meta.outputs.vsix_name }}
        run: npx @vscode/vsce package --out "$VSIX_NAME"

      - name: Create GitHub Release & Upload VSIX Asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          TITLE: ${{ steps.release_meta.outputs.title }}
          VSIX_NAME: ${{ steps.release_meta.outputs.vsix_name }}
          TARGET_SHA: ${{ github.sha }}
          IS_DRAFT: ${{ inputs.draft }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          FLAGS=()
          if [ "$IS_DRAFT" = "true" ]; then
            FLAGS+=("--draft")
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS+=("--prerelease")
          fi
          gh release create "$TAG" "$VSIX_NAME" \
            --target "$TARGET_SHA" \
            --title "$TITLE" \
            --generate-notes \
            "${FLAGS[@]}"
